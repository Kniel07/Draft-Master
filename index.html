<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mobile-first draft assistant for Mobile Legends: Bang Bang — ranked and tournament pick-and-ban advice with counters, synergy, comfort picks and a pre-game brief. The app recommends; the player decides.">
<meta name="theme-color" content="#07090f">
<meta name="color-scheme" content="dark">
<title>Draft Room — MLBB Draft Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/mobile.css">
<link rel="stylesheet" href="styles/draft.css">
<link rel="stylesheet" href="styles/tournament.css">
</head>
<body>

<div id="boot" class="boot">
  <p class="boot__loading">Loading hero data…</p>
</div>

<div id="app" class="app" hidden>

  <header class="topbar">
    <div class="topbar__row">
      <span class="brand">DRAFT<span>ROOM</span></span>
      <button class="badge" id="data-badge" type="button" aria-label="Data source — open settings"></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-active" type="button" role="tab" data-view="draft" aria-selected="true">Draft</button>
      <button class="tab" type="button" role="tab" data-view="brief" aria-selected="false">Brief</button>
      <button class="tab" type="button" role="tab" data-view="setup" aria-selected="false">Setup</button>
    </nav>
  </header>

  <p class="note" id="storage-note" hidden>
    This browser is blocking local storage, so your rank, role and comfort pool will reset when you reload.
  </p>

  <main class="main">

    <section class="view" id="view-draft" role="tabpanel" aria-label="Draft board">
      <div class="timeline" id="timeline" hidden></div>
      <div class="boards" id="board"></div>
      <div class="turn" id="turn"></div>
      <div class="controls" id="controls"></div>
      <section class="panel" id="recommendations" aria-live="polite"></section>
      <section class="panel" id="synergy" hidden></section>
      <section class="panel" id="strength"></section>
    </section>

    <section class="view" id="view-brief" role="tabpanel" aria-label="Pre-game brief" hidden></section>

    <section class="view setup" id="view-setup" role="tabpanel" aria-label="Setup" hidden></section>

  </main>

  <div class="actionbar" id="actionbar" hidden></div>

  <footer class="foot">
    <p>The app recommends. The player decides. Hero, counter and synergy data live in <code>data/</code> — a patch update is a JSON edit.</p>
  </footer>

</div>

<div id="sheet-host"></div>
<div class="toast-host" id="toast-host" aria-live="polite"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
